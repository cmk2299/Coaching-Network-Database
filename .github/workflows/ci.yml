name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (real bugs — syntax, undefined names, unused imports/f-strings)
        # HARD GATE (2026-06-24): F (pyflakes) + E9 (syntax). F841 (assigned-but-
        # unused local) is excluded — 39 remain in legacy scripts and its autofix
        # is unsafe (may drop a side-effecting RHS); clean those up before adding it.
        run: ruff check execution/ tests/ --select F,E9 --ignore F841 --output-format=github

      - name: Compile-check all execution scripts
        run: python -m compileall -q execution/

      - name: Unit tests
        run: python -m pytest tests/ -v
